<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Трекер накоплений</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    margin: 0; padding: 16px; min-height: 100vh;
    background: radial-gradient(circle at 15% -10%, #3a2f8f 0%, #1c1740 35%, #0a0918 75%);
    color: #f5f3ff;
  }

  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab {
    flex: 1; text-align: center; padding: 11px; border-radius: 14px;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    font-size: 13px; font-weight: 700; cursor: pointer; opacity: 0.5;
  }
  .tab.active {
    opacity: 1;
    background: linear-gradient(135deg, rgba(167,139,250,0.3), rgba(236,72,153,0.3));
    border-color: rgba(255,255,255,0.25);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.25);
  }

  .top { text-align: center; margin-bottom: 10px; }
  .top .brand { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.5; font-weight: 700; }
  .top .amount {
    font-family: 'Archivo Black', sans-serif; font-size: 36px; margin-top: 6px;
    background: linear-gradient(90deg, #a78bfa, #f0abfc);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .streak-badge {
    display: inline-block; margin-top: 8px; padding: 4px 12px; border-radius: 999px;
    background: rgba(251,146,60,0.15); color: #fb923c; font-size: 12px; font-weight: 700;
  }

  .card {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.14);
    border-top-color: rgba(255,255,255,0.3);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    border-radius: 20px; padding: 16px; margin-bottom: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.12);
  }
  .card-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; opacity: 0.5; margin: 0 0 10px; }

  .templates { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 10px; padding-bottom: 2px; }
  .chip {
    flex-shrink: 0; display: flex; align-items: center; gap: 6px;
    padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.14); font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }

  select {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15);
    background: rgba(0,0,0,0.25); color: #fff; font-size: 15px;
  }

  .quick-input { display: flex; gap: 8px; }
  .quick-input input {
    flex: 1; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15);
    background: rgba(0,0,0,0.25); color: #fff; font-size: 15px;
  }
  .quick-input input::placeholder { color: rgba(255,255,255,0.35); font-size: 13px; }
  .quick-input button {
    padding: 0 18px; border-radius: 12px; border: none;
    background: linear-gradient(135deg, #a78bfa, #ec4899); color: #fff; font-weight: 700; font-size: 20px; cursor: pointer;
  }
  .hint { font-size: 11px; opacity: 0.4; margin-top: 8px; }

  .donut-wrap { display: flex; align-items: center; gap: 18px; }
  .donut { width: 108px; height: 108px; border-radius: 50%; flex-shrink: 0; position: relative; }
  .donut::after { content: ''; position: absolute; inset: 14px; border-radius: 50%; background: #1c1740; }
  .donut-total { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; z-index: 2; }
  .donut-total .num { font-family: 'Archivo Black', sans-serif; font-size: 15px; }
  .donut-total .lbl { font-size: 9px; opacity: 0.5; margin-top: 2px; }
  .legend { flex: 1; display: flex; flex-direction: column; gap: 7px; }
  .legend-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .legend-cat { flex: 1; opacity: 0.85; }
  .legend-pct { font-weight: 700; opacity: 0.9; }

  .goal { margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid rgba(255,255,255,0.07); }
  .goal:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
  .goal-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .goal-head .name { font-weight: 700; font-size: 14px; }
  .goal-head .pct { font-family: 'Archivo Black', sans-serif; font-size: 15px; color: #6ee7b7; }
  .goal-nums { font-size: 11px; opacity: 0.5; margin-bottom: 6px; }
  .bar-track { background: rgba(255,255,255,0.08); border-radius: 999px; height: 8px; overflow: hidden; margin-bottom: 8px; }
  .bar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #34d399, #a7f3d0); }
  .goal-add { display: flex; gap: 6px; }
  .goal-add input {
    flex: 1; padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15);
    background: rgba(0,0,0,0.25); color: #fff; font-size: 13px;
  }
  .goal-add button {
    padding: 0 14px; border-radius: 8px; border: none; background: rgba(110,231,183,0.2); color: #6ee7b7; font-weight: 700; cursor: pointer;
  }

  .add-goal-form { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.07); }
  .add-goal-form input {
    padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15);
    background: rgba(0,0,0,0.25); color: #fff; font-size: 14px;
  }
  .emoji-picker { display: flex; gap: 6px; flex-wrap: wrap; }
  .emoji-opt {
    width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font-size: 18px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); cursor: pointer;
  }
  .emoji-opt.selected { background: rgba(167,139,250,0.3); border-color: #a78bfa; }
  .add-goal-form .addBtn {
    padding: 12px; border-radius: 10px; border: none; background: linear-gradient(135deg, #a78bfa, #ec4899); color: #fff; font-weight: 700; cursor: pointer;
  }

  .history-item { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 14px; }
  .history-item:last-child { border-bottom: none; }
  .history-item .emoji { font-size: 18px; }
  .history-item .comment { flex: 1; opacity: 0.85; font-size: 13px; }
  .history-item .amt { font-weight: 700; font-size: 14px; }
  .amt.pos { color: #6ee7b7; }
  .amt.neg { color: #fda4af; }

  .empty { font-size: 12px; opacity: 0.4; text-align: center; padding: 8px 0; }
  .error { color: #fda4af; font-size: 12px; margin-top: 8px; display: none; }

  .debt-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .debt-item:last-child { border-bottom: none; }
  .debt-item .info { flex: 1; }
  .debt-item .dname { font-weight: 700; font-size: 14px; }
  .debt-item .damt { font-size: 12px; opacity: 0.6; }
  .debt-item button { padding: 6px 12px; border-radius: 8px; border: none; background: rgba(110,231,183,0.15); color: #6ee7b7; font-size: 12px; font-weight: 700; cursor: pointer; }
  .debt-section-title { font-size: 12px; font-weight: 700; opacity: 0.6; margin: 12px 0 6px; }
  .debt-section-title:first-child { margin-top: 0; }

  .debt-form { display: flex; flex-direction: column; gap: 8px; }
  .debt-form input { padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.25); color: #fff; font-size: 14px; }
  .direction-toggle { display: flex; gap: 8px; }
  .direction-toggle button { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.2); color: rgba(255,255,255,0.6); font-size: 13px; font-weight: 700; cursor: pointer; }
  .direction-toggle button.active.in { background: rgba(110,231,183,0.2); color: #6ee7b7; border-color: rgba(110,231,183,0.4); }
  .direction-toggle button.active.out { background: rgba(253,164,175,0.2); color: #fda4af; border-color: rgba(253,164,175,0.4); }
  .debt-form .addBtn { padding: 12px; border-radius: 10px; border: none; background: linear-gradient(135deg, #a78bfa, #ec4899); color: #fff; font-weight: 700; cursor: pointer; }

  .hidden { display: none; }
</style>
</head>
<body>

  <div class="tabs">
    <div class="tab active" data-tab="main">Главная</div>
    <div class="tab" data-tab="debts">Долги</div>
  </div>

  <div id="mainTab">
    <div class="top">
      <div class="brand">Мой трекер</div>
      <div class="amount" id="balance">0 ₽</div>
      <div class="streak-badge hidden" id="streakBadge">🔥 0 дн. подряд</div>
    </div>

    <div class="card">
      <p class="card-title">Быстрая запись</p>
      <div class="templates" id="templates"></div>
      <div class="quick-input">
        <input type="text" id="quickText" placeholder="потратил 350 на кофе / отложил 5000 на машину">
        <button id="quickBtn">→</button>
      </div>
      <p class="hint">Фраза вида «потратил / отложил / зарплата» — сумма и категория сами</p>
      <p class="error" id="error"></p>
    </div>

    <div class="card hidden" id="summaryCard">
      <p class="card-title">Траты в этом месяце</p>
      <div class="donut-wrap">
        <div class="donut" id="donut"><div class="donut-total"><span class="num" id="donutTotal">0</span><span class="lbl">всего</span></div></div>
        <div class="legend" id="legend"></div>
      </div>
    </div>

    <div class="card">
      <p class="card-title">Валюта</p>
      <select id="currency"></select>
    </div>

    <div class="card">
      <p class="card-title">Цели накопления</p>
      <div id="goals"></div>
      <div class="add-goal-form">
        <input type="text" id="goalName" placeholder="Название цели (например Машина)">
        <input type="number" id="goalTarget" placeholder="Сколько нужно всего">
        <div class="emoji-picker" id="emojiPicker"></div>
        <button class="addBtn" id="addGoalBtn">Создать цель</button>
      </div>
    </div>

    <div class="card">
      <p class="card-title">Последние операции</p>
      <div id="history"></div>
    </div>
  </div>

  <div id="debtsTab" class="hidden">
    <div class="card">
      <p class="card-title">Мне должны / Я должен</p>
      <div id="debtsList"></div>
    </div>
    <div class="card">
      <p class="card-title">Записать долг</p>
      <div class="debt-form">
        <input type="text" id="debtName" placeholder="Имя (например Саша)">
        <input type="number" id="debtAmount" placeholder="Сумма">
        <div class="direction-toggle">
          <button type="button" id="dirIn" class="active in">Мне должны</button>
          <button type="button" id="dirOut" class="out">Я должен</button>
        </div>
        <button class="addBtn" id="addDebtBtn">Добавить</button>
      </div>
    </div>
  </div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const userId = tg.initDataUnsafe?.user?.id;
  const CURRENCIES = ["₽", "$", "€", "₴", "£", "PLN"];
  const DEFAULT_GOAL_EMOJIS = ["🎯","🚗","🏠","✈️","💻","📱","🎮","🎓","💍","🐶"];

  const balanceEl = document.getElementById("balance");
  const streakBadgeEl = document.getElementById("streakBadge");
  const currencyEl = document.getElementById("currency");
  const historyEl = document.getElementById("history");
  const goalsEl = document.getElementById("goals");
  const quickText = document.getElementById("quickText");
  const quickBtn = document.getElementById("quickBtn");
  const errorEl = document.getElementById("error");
  const debtsListEl = document.getElementById("debtsList");
  const templatesEl = document.getElementById("templates");
  const summaryCardEl = document.getElementById("summaryCard");
  const donutEl = document.getElementById("donut");
  const donutTotalEl = document.getElementById("donutTotal");
  const legendEl = document.getElementById("legend");
  const emojiPickerEl = document.getElementById("emojiPicker");

  let currentCurrency = "₽";
  let currentDirection = "in";
  let selectedGoalEmoji = "🎯";

  CURRENCIES.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c; opt.textContent = c;
    currencyEl.appendChild(opt);
  });

  function buildEmojiPicker(list) {
    emojiPickerEl.innerHTML = "";
    (list && list.length ? list : DEFAULT_GOAL_EMOJIS).forEach((e, i) => {
      const div = document.createElement("div");
      div.className = "emoji-opt" + (i === 0 ? " selected" : "");
      div.textContent = e;
      div.addEventListener("click", () => {
        document.querySelectorAll(".emoji-opt").forEach(el => el.classList.remove("selected"));
        div.classList.add("selected");
        selectedGoalEmoji = e;
      });
      emojiPickerEl.appendChild(div);
    });
  }
  buildEmojiPicker(DEFAULT_GOAL_EMOJIS);

  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      document.getElementById("mainTab").classList.toggle("hidden", tab.dataset.tab !== "main");
      document.getElementById("debtsTab").classList.toggle("hidden", tab.dataset.tab !== "debts");
    });
  });

  function showError(msg) { errorEl.textContent = msg; errorEl.style.display = "block"; }
  function clearError() { errorEl.style.display = "none"; }

  function renderTemplates(templates) {
    templatesEl.innerHTML = "";
    (templates || []).forEach(t => {
      const chip = document.createElement("div");
      chip.className = "chip";
      chip.innerHTML = `<span>${t.emoji}</span><span>${t.label}</span>`;
      chip.addEventListener("click", () => { quickText.value = t.text; submitQuick(); });
      templatesEl.appendChild(chip);
    });
  }

  function renderDonut(monthStats, colors) {
    const entries = Object.entries(monthStats || {});
    if (entries.length === 0) { summaryCardEl.classList.add("hidden"); return; }
    summaryCardEl.classList.remove("hidden");
    const total = entries.reduce((s, [, v]) => s + v, 0);
    donutTotalEl.textContent = Math.round(total);

    let acc = 0;
    const stops = entries.map(([cat, val]) => {
      const pct = (val / total) * 100;
      const start = acc; acc += pct;
      return `${colors[cat] || "#94a3b8"} ${start}% ${acc}%`;
    });
    donutEl.style.background = `conic-gradient(${stops.join(",")})`;

    const emojiMap = { "еда":"🍔","транспорт":"🚌","шоппинг":"🛍️","дом":"🏠","счета":"📱","развлечения":"🎬","накопление":"🎯","другое":"✨" };
    legendEl.innerHTML = "";
    entries.sort((a,b) => b[1]-a[1]).forEach(([cat, val]) => {
      const pct = Math.round((val/total)*100);
      const row = document.createElement("div");
      row.className = "legend-row";
      row.innerHTML = `<span class="legend-dot" style="background:${colors[cat]||'#94a3b8'}"></span><span class="legend-cat">${emojiMap[cat]||"✨"} ${cat}</span><span class="legend-pct">${pct}%</span>`;
      legendEl.appendChild(row);
    });
  }

  function render(data) {
    currentCurrency = data.currency || "₽";
    balanceEl.textContent = `${data.balance} ${currentCurrency}`;
    currencyEl.value = currentCurrency;

    if (data.streak && data.streak > 1) {
      streakBadgeEl.textContent = `🔥 ${data.streak} дн. подряд`;
      streakBadgeEl.classList.remove("hidden");
    } else {
      streakBadgeEl.classList.add("hidden");
    }

    historyEl.innerHTML = "";
    const history = data.history || [];
    if (history.length === 0) historyEl.innerHTML = '<div class="empty">Пока пусто — напиши первую трату выше</div>';
    history.forEach(item => {
      const row = document.createElement("div");
      row.className = "history-item";
      const sign = item.amount > 0 ? "+" : "";
      const cls = item.amount > 0 ? "pos" : "neg";
      row.innerHTML = `<span class="emoji">${item.emoji || "✨"}</span><span class="comment">${item.comment}</span><span class="amt ${cls}">${sign}${item.amount} ${currentCurrency}</span>`;
      historyEl.appendChild(row);
    });

    const goals = data.goals || {};
    const goalNames = Object.keys(goals);
    goalsEl.innerHTML = "";
    if (goalNames.length === 0) {
      goalsEl.innerHTML = '<div class="empty">Пока нет целей — создай ниже</div>';
    }
    goalNames.forEach(name => {
      const g = goals[name];
      const pct = Math.min(100, Math.round((g.saved / g.target) * 100));
      const div = document.createElement("div");
      div.className = "goal";
      div.innerHTML = `
        <div class="goal-head"><span class="name">${g.emoji || "🎯"} ${name}</span><span class="pct">${pct}%</span></div>
        <div class="goal-nums">${g.saved} / ${g.target} ${currentCurrency}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
        <div class="goal-add">
          <input type="number" placeholder="Сумма" id="add-${name}">
          <button data-name="${name}">${g.emoji || "🎯"} Отложить</button>
        </div>
      `;
      div.querySelector("button").addEventListener("click", () => contributeGoal(name));
      goalsEl.appendChild(div);
    });

    buildEmojiPicker(data.goal_emojis);
    renderDonut(data.month_stats, data.category_colors || {});
    renderTemplates(data.templates);
    renderDebts(data.debts || []);
  }

  function renderDebts(debts) {
    debtsListEl.innerHTML = "";
    const owedToMe = debts.filter(d => d.direction === "in");
    const iOwe = debts.filter(d => d.direction === "out");
    if (debts.length === 0) { debtsListEl.innerHTML = '<div class="empty">Долгов нет</div>'; return; }
    if (owedToMe.length > 0) {
      debtsListEl.innerHTML += '<div class="debt-section-title">Мне должны</div>';
      owedToMe.forEach(d => debtsListEl.appendChild(debtRow(d, "#6ee7b7")));
    }
    if (iOwe.length > 0) {
      debtsListEl.innerHTML += '<div class="debt-section-title">Я должен</div>';
      iOwe.forEach(d => debtsListEl.appendChild(debtRow(d, "#fda4af")));
    }
  }

  function debtRow(d, color) {
    const row = document.createElement("div");
    row.className = "debt-item";
    row.innerHTML = `<div class="info"><div class="dname">${d.name}</div><div class="damt" style="color:${color}">${d.amount} ${currentCurrency}</div></div><button data-id="${d.id}">Отдал ✓</button>`;
    row.querySelector("button").addEventListener("click", () => resolveDebt(d.id));
    return row;
  }

  async function loadData() {
    if (!userId) { showError("Открой это через кнопку в боте, не напрямую в браузере."); return; }
    try {
      const res = await fetch(`/api/data?user_id=${userId}`);
      render(await res.json());
    } catch (e) { showError("Не получилось загрузить данные."); }
  }

  currencyEl.addEventListener("change", async () => {
    try {
      const res = await fetch("/api/currency", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_id: userId, currency: currencyEl.value })
      });
      render(await res.json());
    } catch (e) { showError("Не получилось сменить валюту."); }
  });

  async function submitQuick() {
    clearError();
    const text = quickText.value.trim();
    if (!text) return;
    quickBtn.disabled = true;
    try {
      const res = await fetch("/api/quick-add", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_id: userId, text })
      });
      render(await res.json());
      quickText.value = "";
    } catch (e) { showError("Не получилось записать — попробуй иначе."); }
    finally { quickBtn.disabled = false; }
  }
  quickBtn.addEventListener("click", submitQuick);
  quickText.addEventListener("keydown", (e) => { if (e.key === "Enter") submitQuick(); });

  document.getElementById("addGoalBtn").addEventListener("click", async () => {
    const name = document.getElementById("goalName").value.trim();
    const target = document.getElementById("goalTarget").value;
    if (!name || !target) return;
    try {
      const res = await fetch("/api/goal/add", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_id: userId, name, target, emoji: selectedGoalEmoji })
      });
      render(await res.json());
      document.getElementById("goalName").value = "";
      document.getElementById("goalTarget").value = "";
    } catch (e) { showError("Не получилось создать цель."); }
  });

  async function contributeGoal(name) {
    const input = document.getElementById(`add-${name}`);
    const amount = input.value;
    if (!amount) return;
    try {
      const res = await fetch("/api/goal/contribute", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_id: userId, name, amount })
      });
      render(await res.json());
    } catch (e) { showError("Не получилось отложить в цель."); }
  }

  document.getElementById("dirIn").addEventListener("click", () => {
    currentDirection = "in";
    document.getElementById("dirIn").classList.add("active");
    document.getElementById("dirOut").classList.remove("active");
  });
  document.getElementById("dirOut").addEventListener("click", () => {
    currentDirection = "out";
    document.getElementById("dirOut").classList.add("active");
    document.getElementById("dirIn").classList.remove("active");
  });

  document.getElementById("addDebtBtn").addEventListener("click", async () => {
    const name = document.getElementById("debtName").value.trim();
    const amount = document.getElementById("debtAmount").value;
    if (!name || !amount) return;
    try {
      const res = await fetch("/api/debt/add", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_id: userId, name, amount, direction: currentDirection })
      });
      render(await res.json());
      document.getElementById("debtName").value = "";
      document.getElementById("debtAmount").value = "";
    } catch (e) { showError("Не получилось добавить долг."); }
  });

  async function resolveDebt(id) {
    try {
      const res = await fetch("/api/debt/resolve", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_id: userId, debt_id: id })
      });
      render(await res.json());
    } catch (e) { showError("Не получилось отметить долг."); }
  }

  loadData();
</script>
</body>
</html>
